[package]
name = "infrastructure"
version = "0.1.0"
edition = "2024"

[features]
# Only integration fixtures may inject/inspect a raw pool. Not enabled at runtime.
sqlx-test-support = []

[dependencies]
application = { path = "../application" }
domain = { path = "../domain" }
sqlx.workspace = true
tokio.workspace = true
minijinja.workspace = true
pulldown-cmark.workspace = true
ammonia.workspace = true
# HTML5 分词器：从**清洗后**的正文 HTML 里读 <img src>，与 ammonia 用的是同一个
# 解析器（已作为 ammonia 的传递依赖存在，这里只是提升为直接依赖）。
# 不用手写扫描：注释、属性值里的 `>`、实体转义与 script/style 原始文本都不是
# 字符串查找能正确处理的东西，而这里判断错会直接变成破图或幽灵占用。
html5ever = "0.40"
# Match Axum's single percent-decoding pass for media path parameters.
percent-encoding = "2"
url.workspace = true
time.workspace = true
# Bundle IANA rules so containers do not depend on host tzdata or TZ.
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always"] }
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tracing.workspace = true
reqwest.workspace = true
jsonwebtoken.workspace = true
sha2.workspace = true
getrandom.workspace = true
base64.workspace = true
argon2.workspace = true

[dev-dependencies]
# 测试用 `tokio::time` 断言「操作确实阻塞在身份锁上」。
tokio = { workspace = true, features = ["time"] }

# Standalone database tests: cargo test -p infrastructure --features sqlx-test-support.
# Workspace tests also enable this feature through server dev-dependencies.

