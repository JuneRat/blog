[package]
name = "interfaces"
version = "0.1.0"
edition = "2024"

[dependencies]
application = { path = "../application" }
axum.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["std"] }
prometheus = { version = "0.14", default-features = false }
tower-http = { version = "0.7", features = ["fs"] }
mime_guess = "2"
http-body-util = "0.1"
rpassword.workspace = true
# Serde-only input validation does not affect TS shapes; keep serde-compat for
# tags/renames and verify the wire contract with export_admin_contract/tests.
ts-rs = { version = "12", features = ["uuid-impl", "no-serde-warnings"] }
