name: container

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Verify schema artifacts
        run: |
          python3 -B scripts/schema_contract.py

      - name: Build deployable image
        run: docker build --build-arg VCS_REF="$GITHUB_SHA" --tag blog:ci --tag "blog:$GITHUB_SHA" .

      - name: Build matching recovery image
        run: docker build --target ops --build-arg VCS_REF="$GITHUB_SHA" --tag blog-ops:ci --tag "blog-ops:$GITHUB_SHA" .

      - name: Pull the database image
        run: |
          db_image=$(sed -n 's/^    image: \(postgres:.*\)$/\1/p' compose.yaml)
          test -n "$db_image"
          docker pull "$db_image"

      - name: Verify installation, STARTTLS mail, publishing, themes and isolated restore with Compose
        env:
          BLOG_EXPECT_REVISION: ${{ github.sha }}
        run: python3 -B scripts/test_compose.py --image blog:ci --ops-image blog-ops:ci --smtp-security starttls --report compose-verification-starttls.json

      - name: Verify implicit TLS mail before and after a complete Compose restore
        env:
          BLOG_EXPECT_REVISION: ${{ github.sha }}
        run: python3 -B scripts/test_compose.py --image blog:ci --ops-image blog-ops:ci --smtp-security tls --report compose-verification-tls.json

      - name: Save Compose verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-verification-${{ github.sha }}
          path: compose-verification-*.json
          if-no-files-found: warn

      - name: Package the verified image and deployment files
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p release/ops release/docs release/scripts
          db_image=$(sed -n 's/^    image: \(postgres:.*\)$/\1/p' compose.yaml)
          db_image_id=$(docker image inspect "$db_image" --format '{{.Id}}')
          # Classic docker save/load may discard RepoDigests. Use the exact saved
          # config ID in the offline bundle instead of relying on a registry lookup.
          docker save "blog:$GITHUB_SHA" "blog-ops:$GITHUB_SHA" "$db_image_id" | gzip > release/blog-linux-amd64.tar.gz
          cp compose.yaml .env.example release/
          sed "s|image: $db_image|image: $db_image_id|" compose.yaml > release/compose.yaml
          printf '%s\n' "$db_image" > release/DATABASE_IMAGE
          printf '%s\n' "$db_image_id" > release/DATABASE_IMAGE_ID
          cp ops/postgres-init.sh release/ops/
          cp ops/blog-backup.service ops/blog-backup.timer release/ops/
          cp ops/blog-maintenance.service ops/blog-maintenance.timer release/ops/
          cp -R docs/. release/docs/
          cp scripts/database-roles.sql scripts/compose-init.sh scripts/compose-backup.sh release/scripts/
          printf '%s\n' "blog:$GITHUB_SHA" > release/IMAGE
          printf '%s\n' "blog-ops:$GITHUB_SHA" > release/OPS_IMAGE
          cd release
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS

      - name: Save the release bundle
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: blog-compose-linux-amd64-${{ github.sha }}
          path: release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
