name: container

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify schema artifacts
        run: |
          python3 -B scripts/schema_contract.py

      - name: Verify registry delivery tooling
        run: PYTHONPATH=scripts python3 -B -m unittest scripts/test_registry_release.py scripts/test_container_images.py scripts/test_compose_init.py

      - name: Build deployable image
        run: >-
          docker build --build-arg VCS_REF="$GITHUB_SHA"
          --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          --tag blog:ci --tag "blog:$GITHUB_SHA" .

      - name: Build matching recovery image
        run: >-
          docker build --target ops --build-arg VCS_REF="$GITHUB_SHA"
          --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          --tag blog-ops:ci --tag "blog-ops:$GITHUB_SHA" .

      - name: Pull the database image
        run: |
          db_image=$(sed -n 's/^    image: \(postgres:.*\)$/\1/p' compose.yaml)
          test -n "$db_image"
          docker pull "$db_image"

      - name: Verify installation, STARTTLS mail, publishing, themes and isolated restore with Compose
        env:
          BLOG_EXPECT_REVISION: ${{ github.sha }}
        run: python3 -B scripts/test_compose.py --image blog:ci --ops-image blog-ops:ci --smtp-security starttls --report compose-verification-starttls.json

      - name: Verify implicit TLS mail before and after a complete Compose restore
        env:
          BLOG_EXPECT_REVISION: ${{ github.sha }}
        run: python3 -B scripts/test_compose.py --image blog:ci --ops-image blog-ops:ci --smtp-security tls --report compose-verification-tls.json

      - name: Save Compose verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-verification-${{ github.sha }}
          path: compose-verification-*.json
          if-no-files-found: warn

      - name: Package the verified image and deployment files
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p release/ops release/docs release/scripts
          db_image=$(sed -n 's/^    image: \(postgres:.*\)$/\1/p' compose.yaml)
          db_image_id=$(docker image inspect "$db_image" --format '{{.Id}}')
          # Classic docker save/load may discard RepoDigests. Use the exact saved
          # config ID in the offline bundle instead of relying on a registry lookup.
          docker save "blog:$GITHUB_SHA" "blog-ops:$GITHUB_SHA" "$db_image_id" | gzip > release/blog-linux-amd64.tar.gz
          cp compose.yaml .env.example release/
          sed "s|image: $db_image|image: $db_image_id|" compose.yaml > release/compose.yaml
          printf '%s\n' "$db_image" > release/DATABASE_IMAGE
          printf '%s\n' "$db_image_id" > release/DATABASE_IMAGE_ID
          cp ops/postgres-init.sh release/ops/
          cp ops/blog-backup.service ops/blog-backup.timer release/ops/
          cp ops/blog-maintenance.service ops/blog-maintenance.timer release/ops/
          cp -R docs/. release/docs/
          cp scripts/database-roles.sql scripts/compose-init.sh scripts/compose-backup.sh release/scripts/
          printf '%s\n' "blog:$GITHUB_SHA" > release/IMAGE
          printf '%s\n' "blog-ops:$GITHUB_SHA" > release/OPS_IMAGE
          docker image inspect "blog:$GITHUB_SHA" --format '{{.Id}}' > release/IMAGE_ID
          docker image inspect "blog-ops:$GITHUB_SHA" --format '{{.Id}}' > release/OPS_IMAGE_ID
          cd release
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS

      - name: Save the release bundle
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: blog-compose-linux-amd64-${{ github.sha }}
          path: release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

  publish:
    # PRs and ordinary branch pushes never receive package write permission.
    needs: compose
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    concurrency:
      group: registry-${{ github.repository }}-${{ github.sha }}
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download the images that passed Compose verification
        uses: actions/download-artifact@v4
        with:
          name: blog-compose-linux-amd64-${{ github.sha }}
          path: release

      - name: Verify and load the tested images without rebuilding
        working-directory: release
        run: |
          sha256sum -c SHA256SUMS
          docker load -i blog-linux-amd64.tar.gz

      - name: Sign in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Publish the matching images and prepare the pull-based deployment
        run: >-
          python3 -B scripts/registry_release.py --bundle release --output registry-release
          --repository "$GITHUB_REPOSITORY" --revision "$GITHUB_SHA"

      - name: Save the registry deployment files
        uses: actions/upload-artifact@v4
        with:
          name: blog-compose-registry-linux-amd64-${{ github.sha }}
          path: registry-release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

      - name: Show deployment references
        run: |
          {
            printf 'Published the verified Linux amd64 images. Download **blog-compose-registry-linux-amd64-%s** for server deployment.\n\n' "$GITHUB_SHA"
            printf 'Application: `%s`\n\n' "$(cat registry-release/IMAGE)"
            printf 'Operations: `%s`\n\n' "$(cat registry-release/OPS_IMAGE)"
            printf 'The deployment files pin both registry digests. See `docs/docker-compose.md` in the artifact for installation and private-registry login.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Sign out of the registry
        if: always()
        run: docker logout ghcr.io
