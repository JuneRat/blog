name: ci

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: blog
          POSTGRES_PASSWORD: blog
          POSTGRES_DB: blog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blog"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://blog:blog@127.0.0.1:5432/blog
      BLOG_TEST_ADMIN_URL: postgres://blog:blog@127.0.0.1:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Dependency boundaries
        run: |
          python3 -B scripts/check_dependencies.py
          PYTHONPATH=scripts python3 -B -m unittest scripts/test_check_dependencies.py

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Recovery tool tests
        run: PYTHONPATH=scripts python3 -B -m unittest scripts/test_recovery.py

  web:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/admin

    steps:
      - uses: actions/checkout@v4

      # 版本取 package.json 的 packageManager 字段。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/admin/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Tests
        run: pnpm test

      # tsc --noEmit + vite build：类型与产物同时自检。
      - name: Build
        run: pnpm build
