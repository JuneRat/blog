name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: blog
          POSTGRES_PASSWORD: blog
          POSTGRES_DB: blog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blog"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://blog:blog@127.0.0.1:5432/blog
      BLOG_TEST_ADMIN_URL: postgres://blog:blog@127.0.0.1:5432/postgres

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Immutable migrations and generated schema artifacts
        env:
          SCHEMA_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 -B scripts/schema_contract.py --base-ref "$SCHEMA_BASE_REF"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Dependency boundaries
        run: |
          python3 -B scripts/check_dependencies.py

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Generated admin HTTP contract
        run: cargo run -p interfaces --example export_admin_contract -- --check

      - name: Tests
        run: cargo test --workspace

      - name: Script unit tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes age
          BLOG_RECOVERY_TEST=0 PYTHONPATH=scripts python3 -B -m unittest discover -s scripts -p 'test_*.py'

      - name: Isolated recovery, schema upgrade and database roles drill
        env:
          BLOG_RECOVERY_TEST: "1"
          BLOG_TEST_PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          cargo build -p server --bin blog
          PYTHONPATH=scripts python3 -B -m unittest scripts/test_recovery_postgres.py

  web:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/admin

    steps:
      - uses: actions/checkout@v4

      # 版本取 package.json 的 packageManager 字段。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/admin/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Tests
        run: pnpm test

      # tsc --noEmit + vite build：类型与产物同时自检。
      - name: Build
        run: pnpm build

      - name: Share the production admin build with acceptance
        uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: apps/admin/dist
          retention-days: 1

  acceptance:
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: blog
          POSTGRES_PASSWORD: blog
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blog -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      BLOG_TEST_ADMIN_URL: postgres://blog:blog@127.0.0.1:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/download-artifact@v4
        with:
          name: admin-dist
          path: apps/admin/dist

      - name: Build server
        run: cargo build -p server --bin blog

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/admin/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/admin/pnpm-lock.yaml

      - name: Install browser tests
        run: |
          pnpm --dir apps/admin install --frozen-lockfile
          pnpm --dir apps/admin exec playwright install --with-deps chromium

      - name: First install, authoring, comments and isolated recovery
        env:
          BLOG_TEST_PG_CONTAINER: ${{ job.services.postgres.id }}
        run: python3 -B scripts/acceptance.py --browser --report acceptance-report.json

      - name: Save browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-results
          path: apps/admin/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Save acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-report
          path: acceptance-report.json
          if-no-files-found: ignore
          retention-days: 14
