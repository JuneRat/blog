{% extends "base.html" %}
{% block content %}
<div class="section-heading"><span>01 / Journal</span><h1>最新文章</h1></div>
{% if posts %}
<div class="article-list">
  {% for post in posts %}
  <article class="article-card">
    <p class="article-meta"><time>{{ post.published_at }}</time><span>·</span><span>{{ post.author_display }}</span></p>
    <h2><a href="{{ post_url(slug=post.slug) | url }}">{{ post.title }}</a></h2>
    {% if post.excerpt %}<p>{{ post.excerpt }}</p>{% endif %}
    <a class="read-more" href="{{ post_url(slug=post.slug) | url }}">阅读文章 <span aria-hidden="true">↗</span></a>
  </article>
  {% endfor %}
</div>
{% else %}<p class="empty">还没有公开文章。</p>{% endif %}
{% endblock %}
