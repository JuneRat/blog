{% extends "base.html" %}
{% block content %}
<article class="page">
  <h1>{{ page.title }}</h1>
  <p class="meta">
    {% if page.published_at %}<time>{{ page.published_at }}</time>{% endif %}
  </p>
  <div class="content" data-content-root>{{ page.content_html | safe }}</div>
</article>
{% endblock %}
